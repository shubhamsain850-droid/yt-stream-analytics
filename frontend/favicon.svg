<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40"/>
      <stop offset="100%" stop-color="#e60026"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffebee"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer camera / monitor frame -->
  <rect x="10" y="14" width="34" height="24" rx="4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.4"/>
  <polygon points="44,21 54,16 54,36 44,31" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Metric Chart Bars (Analytics signature) -->
  <rect x="15" y="27" width="4" height="8" rx="1.5" fill="#ffffff"/>
  <rect x="22" y="22" width="4" height="13" rx="1.5" fill="#ffffff"/>
  <rect x="29" y="18" width="4" height="17" rx="1.5" fill="#ffffff"/>

  <!-- Rising Metric Trend Line -->
  <path d="M12 48 L22 42 L32 45 L44 35 L52 38" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend arrow tip -->
  <polyline points="47,35 52,38 51,43" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend Dot -->
  <circle cx="44" cy="35" r="2.5" fill="#ffffff"/>
</svg>


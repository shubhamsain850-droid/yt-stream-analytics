<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tmFavRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#ff0033"/>
      <stop offset="100%" stop-color="#c40026"/>
    </linearGradient>
    <linearGradient id="tmCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="tmSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. Vibrant YouTube Red Squircle Badge -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#tmFavRed)"/>
  
  <!-- 2. Subtle Top Ambient Glass Sheen -->
  <path d="M 4 28 C 4 14, 14 4, 28 4 L 72 4 C 86 4, 96 14, 96 28 C 96 36, 62 42, 4 36 Z" fill="url(#tmSheen)"/>

  <!-- 3. Metrix T — Top Horizontal Crossbar (Solid Crisp White) -->
  <rect x="18" y="22" width="64" height="15" rx="7.5" fill="#ffffff"/>

  <!-- 4. Metrix Analytics Rising Pillar Bars (3 Solid Steps) -->
  <rect x="33.5" y="48" width="9" height="28" rx="4.5" fill="#ffffff" opacity="0.82"/>
  <rect x="45.5" y="40" width="9" height="36" rx="4.5" fill="#ffffff" opacity="0.96"/>
  <rect x="57.5" y="32" width="9" height="44" rx="4.5" fill="url(#tmCyan)"/>

  <!-- 5. Metrix Surge Arrow (Growth Trend Cutting Up-Right) -->
  <path d="M 22 74 L 75 24" stroke="url(#tmCyan)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 57 24 L 75 24 L 75 42" fill="none" stroke="url(#tmCyan)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
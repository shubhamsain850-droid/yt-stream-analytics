<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1d"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="tmRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    <linearGradient id="cyanArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Square / Squircle Badge -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="url(#bg)" stroke="#ff0033" stroke-width="1.8" stroke-opacity="0.5"/>
  <circle cx="50" cy="50" r="39" fill="none" stroke="url(#tmRed)" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- T Top Bar in YouTube Red -->
  <path d="M 22 25 L 78 25 L 78 36 L 65 36 L 65 36 L 35 36 L 22 36 Z"
        fill="none" stroke="url(#tmRed)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 3 Analytics Bars in Red & White -->
  <path d="M 39 52 L 39 71 L 44 74 L 44 49 Z" fill="none" stroke="url(#tmRed)" stroke-width="2.5" stroke-linejoin="round" opacity="0.7"/>
  <path d="M 48 44 L 48 76 L 53 79 L 53 40 Z" fill="none" stroke="url(#tmRed)" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>
  <path d="M 57 36 L 57 72 L 62 69 L 62 36 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Growth Arrow in Electric Cyan Neon -->
  <line x1="28" y1="70" x2="74" y2="28" stroke="url(#cyanArrow)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <polyline points="60 28, 75 28, 75 43" fill="none" stroke="url(#cyanArrow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
